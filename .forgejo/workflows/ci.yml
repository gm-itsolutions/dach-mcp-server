# Forgejo CI (Runner gm-hosting). Prüfung bei jedem Push und Pull Request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.gm-itsolutions.de/gm-actions/actions-checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pip install . geht nicht (hatchling findet kein Paket), daher Abhängigkeiten aus pyproject
      - run: python -m pip install $(python -c 'import tomllib;print(" ".join(repr(d) for d in tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]))' | tr -d "'")
      - run: python -m compileall -q src
      - run: python -c 'import src.server'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.gm-itsolutions.de/gm-actions/actions-checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t ci-test .
      # Import im Image (Python 3.12 wie in Produktion)
      - run: docker run --rm ci-test python -c 'import src.server'
